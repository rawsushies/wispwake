name: Feature Request
description: Suggest an environmental mechanic, accessibility option, or quality-of-life improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea that fits the world of **The Veilgrove**? Share it below!
  - type: textarea
    id: proposal
    attributes:
      label: Feature Description
      description: Describe the feature and how it aligns with Wispwake's atmospheric exploration and Wake mechanic.
    validations:
      required: true
  - type: textarea
    id: implementation
    attributes:
      label: Proposed Technical Approach (Optional)
      description: Which files or systems would this touch?
